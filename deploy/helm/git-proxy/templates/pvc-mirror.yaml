{{- if and .Values.persistence.mirror.enabled (not .Values.persistence.mirror.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "git-proxy.fullname" . }}-mirror
  labels:
    {{- include "git-proxy.labels" . | nindent 4 }}
  {{- with .Values.persistence.mirror.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.mirror.accessModes | nindent 4 }}
  {{- if .Values.persistence.mirror.storageClass }}
  {{- if eq .Values.persistence.mirror.storageClass "-" }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.persistence.mirror.storageClass }}
  {{- end }}
  {{- end }}
  {{- with .Values.persistence.mirror.selector }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.mirror.size }}
{{- end }}
