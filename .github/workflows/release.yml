name: release

# Build the git-proxy Docker image and publish it to the GitHub Container
# Registry (GHCR) when a GitHub Release is published. The image is tagged with
# the release tag (verbatim, e.g. release tag "v1.0.0" → ghcr.io/<owner>/git-proxy:v1.0.0).
#
# Safety: this workflow only runs on the canonical repository AND only for
# releases cut from `main`. Forks and releases created from other branches are
# skipped (the job-level `if` below no-ops them).

on:
  release:
    types: [published]

permissions:
  contents: read    # checkout the tagged commit
  packages: write   # push the image to ghcr.io

jobs:
  docker-publish:
    name: publish docker image to GHCR
    runs-on: ubuntu-latest
    # Only the canonical repo, and only releases whose target branch is main.
    # github.event.release.target_commitish is the branch the release was created
    # from; a release cut from a feature branch is skipped here.
    if: github.repository == 'psenna/git-proxy' && github.event.release.target_commitish == 'main'
    steps:
      - name: checkout release tag
        # actions/checkout defaults to the ref that triggered the event — for a
        # release, that is the tag's commit (detached HEAD). We build exactly the
        # tagged source, not whatever main points at when the run starts.
        uses: actions/checkout@v4

      - name: set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Build and push both architectures as a multi-arch manifest list.
          platforms: linux/amd64,linux/arm64
          # The release tag verbatim, as the image tag.
          tags: ghcr.io/${{ github.repository_owner }}/git-proxy:${{ github.event.release.tag_name }}
          # Keep the manifest a plain multi-arch manifest list (no provenance
          # or SBOM attestations) so it matches what `docker build` produces
          # locally and what the example compose consumes.
          provenance: false

  helm-publish:
    name: publish helm chart to GHCR (OCI)
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.repository == 'psenna/git-proxy' && github.event.release.target_commitish == 'main'
    steps:
      - name: checkout release tag
        uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # appVersion is NOT asserted against the release tag: it is stamped from the
      # tag at package time (see "package chart" below), so a mismatch is
      # impossible and there is nothing to hand-maintain before cutting a
      # release. A stale value in Chart.yaml still matters for anyone running
      # helm install straight from a git checkout -- image.tag defaults to
      # .Chart.AppVersion -- so surface drift as a notice, never as a failure.
      - name: notice if Chart.yaml appVersion has drifted from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          stored="$(helm show chart deploy/helm/git-proxy | awk -F': ' '/^appVersion:/ {print $2}')"
          if [ "$stored" != "$TAG" ]; then
            echo "::notice::Chart.yaml appVersion is '$stored' but this release is '$TAG'. The published chart is stamped with '$TAG', so this release is correct. Bump deploy/helm/git-proxy/Chart.yaml's appVersion when convenient so a helm install from a checkout defaults to a current image."
          fi

      - name: log in to GHCR (helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: assert this chart version is not already published
        run: |
          set -eu
          version="$(helm show chart deploy/helm/git-proxy | awk -F': ' '/^version:/ {print $2}')"
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/git-proxy" --version "$version" >/dev/null 2>&1; then
            echo "chart version $version is already published to oci://ghcr.io/${{ github.repository_owner }}/charts/git-proxy — bump deploy/helm/git-proxy/Chart.yaml's version before releasing."
            exit 1
          fi

      # --app-version stamps the release tag into the packaged chart's appVersion,
      # overriding whatever Chart.yaml holds. This is what makes the release
      # self-consistent without a manual bump. The .tgz filename is derived from
      # the chart version, not appVersion, so the push glob below is unaffected.
      - name: package chart
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: helm package deploy/helm/git-proxy -d dist --app-version "$TAG"

      - name: push chart
        run: helm push dist/git-proxy-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: first-publish notice
        run: echo "::notice::If this is the first publish, the GHCR package ghcr.io/${{ github.repository_owner }}/charts/git-proxy is created PRIVATE. Flip it to public at https://github.com/users/${{ github.repository_owner }}/packages/container/charts%2Fgit-proxy/settings or consumers cannot install it."
